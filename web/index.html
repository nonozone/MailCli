<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MailCLI Mail Center</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">@</span>
          <div>
            <p class="eyebrow">MailCLI Local</p>
            <h1>Mail Desk</h1>
          </div>
        </div>
        <div class="top-actions">
          <p id="session-status" class="status">Starting local session</p>
          <button id="sync-mail" type="button">Sync</button>
        </div>
      </header>

      <section class="mail-workbench">
        <aside class="account-rail workspace-section">
          <div class="section-head">
            <h2>Accounts</h2>
            <button id="refresh-accounts" type="button">Refresh</button>
          </div>
          <div id="accounts" class="account-list"></div>
        </aside>

        <section class="inbox-column workspace-section">
          <div class="section-head">
            <h2>Unified Inbox</h2>
          </div>
          <div class="search-row">
            <input id="search-query" type="search" placeholder="Search indexed mail">
            <button id="search-mail" type="button">Search</button>
          </div>
          <div id="messages" class="message-list"></div>
        </section>

        <section class="reader-column workspace-section">
          <div class="section-head">
            <h2>Message</h2>
          </div>
          <article id="message-detail" class="message-detail muted">
            Select a message.
          </article>
        </section>

        <aside class="action-rail">
          <section class="workspace-section compose-section">
            <div class="section-head">
              <h2>Draft</h2>
              <button id="prepare-send" type="button">Prepare</button>
            </div>
            <form id="compose-form" class="compose-form">
              <label>
                To
                <input id="compose-to" type="email" placeholder="recipient@example.com">
              </label>
              <label>
                Subject
                <input id="compose-subject" type="text" placeholder="Subject">
              </label>
              <label>
                Body
                <textarea id="compose-body" rows="6" placeholder="Plain-text draft"></textarea>
              </label>
              <p id="compose-status" class="meta"></p>
            </form>
          </section>

          <section class="workspace-section operations-section">
            <div class="section-head">
              <h2>Operations</h2>
              <button id="refresh-operations" type="button">Refresh</button>
            </div>
            <div id="operations" class="operation-list"></div>
          </section>
        </aside>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
