name: test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: make test

      - name: Build mailcli
        run: make build

      - name: Check local thread demo artifacts
        run: make demo-local-thread-check
